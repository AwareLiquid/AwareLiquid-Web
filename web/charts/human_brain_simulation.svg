<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="t">Sparse SNN from connectome statistical laws: near-dense accuracy at ~107x lower energy</title>
  <desc id="d">Left: a sparse network whose edges follow the statistical laws of the real Drosophila connectome (0.09% sparsity, scale-free degree, small-world, E/I 60/40). The static connectome topology gave no advantage over random graphs; the statistical laws do. Right: MNIST and Fashion-MNIST accuracy (dense MLP vs sparse SNN) and an estimated ~107x lower energy for the sparse SNN.</desc>
  <style>
    .bg{fill:#0e0e10}
    .ttl{fill:#f5f5f7;font-size:17px;font-weight:700}
    .sub{fill:#9a9aa5;font-size:12px}
    .lab{fill:#c9c9d1;font-size:12px}
    .dim{fill:#7a7a85;font-size:11px}
    .ex{fill:#4f9dff}
    .inh{fill:#e0556b}
    .edge{stroke:#4a4a55;stroke-width:1}
    .axis{stroke:#2a2a31;stroke-width:1}
    .dense{fill:#4a4a55}
    .sparse{fill:#4f9dff}
    .val{fill:#f5f5f7;font-size:12px;font-weight:600}
  </style>
  <rect class="bg" x="0" y="0" width="900" height="420"/>
  <text class="ttl" x="32" y="36">Sparse spiking networks from real brain connectomes</text>
  <text class="sub" x="32" y="58">The connectome&#39;s static topology gave no advantage — its statistical laws transfer. Near-dense accuracy at an estimated ~107&#215; lower energy.</text>

  <!-- Panel A: sparse graph -->
  <text class="lab" x="32" y="96">Sparse connectome-structured graph</text>
  <g>
    <!-- nodes (fan out) -->
    <circle class="ex" cx="70" cy="150" r="4"/><circle class="ex" cx="120" cy="128" r="3.5"/><circle class="inh" cx="120" cy="172" r="3.5"/>
    <circle class="ex" cx="175" cy="140" r="3.5"/><circle class="ex" cx="175" cy="186" r="3"/><circle class="inh" cx="175" cy="112" r="3"/>
    <circle class="ex" cx="230" cy="126" r="3"/><circle class="ex" cx="230" cy="160" r="4"/><circle class="inh" cx="230" cy="196" r="3"/>
    <circle class="ex" cx="285" cy="142" r="3.5"/><circle class="ex" cx="285" cy="180" r="3"/><circle class="inh" cx="285" cy="118" r="3"/>
    <circle class="ex" cx="340" cy="132" r="3.5"/><circle class="ex" cx="340" cy="168" r="3.5"/><circle class="inh" cx="340" cy="200" r="3"/>
    <circle class="ex" cx="300" cy="234" r="3"/><circle class="ex" cx="210" cy="240" r="3"/><circle class="inh" cx="150" cy="226" r="3"/>
    <!-- edges (sparse) -->
    <g class="edge">
      <line x1="70" y1="150" x2="120" y2="128"/><line x1="70" y1="150" x2="120" y2="172"/>
      <line x1="120" y1="128" x2="175" y2="140"/><line x1="120" y1="172" x2="175" y2="186"/>
      <line x1="175" y1="140" x2="230" y2="126"/><line x1="175" y1="186" x2="230" y2="196"/>
      <line x1="230" y1="126" x2="285" y2="142"/><line x1="230" y1="160" x2="285" y2="180"/>
      <line x1="285" y1="142" x2="340" y2="132"/><line x1="285" y1="180" x2="340" y2="168"/>
      <line x1="230" y1="160" x2="340" y2="168"/><line x1="175" y1="112" x2="230" y2="160"/>
      <line x1="150" y1="226" x2="210" y2="240"/><line x1="210" y1="240" x2="300" y2="234"/>
      <line x1="285" y1="180" x2="300" y2="234"/>
    </g>
  </g>
  <text class="dim" x="32" y="276">Sparsity 0.09% &#183; scale-free degree (max/mean &#8776; 75)</text>
  <text class="dim" x="32" y="294">small-world (clustering 6.65&#215; random) &#183; E/I 60/40</text>
  <text class="dim" x="32" y="316"><tspan class="ex">&#9679;</tspan> excitatory  <tspan class="inh">&#9679;</tspan> inhibitory</text>

  <!-- Panel B: accuracy + energy -->
  <text class="lab" x="470" y="96">Accuracy vs. a dense MLP</text>
  <!-- MNIST group -->
  <text class="dim" x="470" y="128">MNIST</text>
  <rect class="dense" x="470" y="136" width="260" height="16" rx="3"/><text class="val" x="740" y="148">98.3%</text>
  <rect class="sparse" x="470" y="156" width="256" height="16" rx="3"/><text class="val" x="736" y="168">96.8%</text>
  <!-- Fashion group -->
  <text class="dim" x="470" y="200">Fashion-MNIST</text>
  <rect class="dense" x="470" y="208" width="232" height="16" rx="3"/><text class="val" x="712" y="220">87.6%</text>
  <rect class="sparse" x="470" y="228" width="230" height="16" rx="3"/><text class="val" x="710" y="240">87.1%</text>
  <text class="dim" x="470" y="268"><tspan class="dense">&#9632;</tspan> dense MLP  <tspan class="sparse">&#9632;</tspan> sparse SNN (5% density, LIF)</text>

  <!-- energy callout -->
  <rect x="470" y="292" width="380" height="88" rx="10" fill="#16161a" stroke="#2a2a31"/>
  <text class="val" x="490" y="322" style="font-size:26px">~107&#8211;112&#215;</text>
  <text class="lab" x="490" y="344">lower energy at ~1 pt accuracy cost</text>
  <text class="dim" x="490" y="364">45nm CMOS model estimate (Horowitz 2014) — not measured on hardware</text>
  <text class="dim" x="490" y="379">firing rate ~8% &#183; spike ops are additions only</text>
</svg>
