<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system,'Segoe UI',sans-serif">
  <rect width="640" height="360" fill="#16161a" rx="12"/>
  <!-- grid -->
  <g stroke="#26262c" stroke-width="1">
    <line x1="60" y1="40" x2="60" y2="300"/>
    <line x1="60" y1="300" x2="610" y2="300"/>
    <line x1="60" y1="235" x2="610" y2="235" stroke-dasharray="3 4"/>
    <line x1="60" y1="170" x2="610" y2="170" stroke-dasharray="3 4"/>
    <line x1="60" y1="105" x2="610" y2="105" stroke-dasharray="3 4"/>
  </g>
  <!-- y labels -->
  <g fill="#9a9aa5" font-size="11">
    <text x="50" y="304" text-anchor="end">0.1 MB</text>
    <text x="50" y="239" text-anchor="end">10 MB</text>
    <text x="50" y="174" text-anchor="end">100 MB</text>
    <text x="50" y="109" text-anchor="end">1 GB</text>
  </g>
  <!-- x labels -->
  <g fill="#9a9aa5" font-size="11" text-anchor="middle">
    <text x="90" y="320">512</text>
    <text x="215" y="320">8K</text>
    <text x="340" y="320">128K</text>
    <text x="465" y="320">512K</text>
    <text x="590" y="320">1M tokens</text>
  </g>
  <!-- KV cache line (rises exponentially) -->
  <polyline points="90,292 215,272 340,236 465,196 590,105"
            fill="none" stroke="#9a9aa5" stroke-width="2.5"/>
  <!-- O(1) state line (flat) -->
  <polyline points="90,282 215,282 340,282 465,282 590,282"
            fill="none" stroke="#4f9dff" stroke-width="3"/>
  <!-- 1M marker -->
  <line x1="590" y1="105" x2="590" y2="282" stroke="#4f9dff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g>
    <rect x="470" y="80" width="112" height="24" rx="6" fill="#4f9dff"/>
    <text x="526" y="96" text-anchor="middle" fill="#0e0e10" font-size="12.5" font-weight="700">8063× smaller</text>
  </g>
  <!-- legend -->
  <g font-size="12">
    <line x1="80" y1="342" x2="105" y2="342" stroke="#9a9aa5" stroke-width="2.5"/>
    <text x="112" y="346" fill="#9a9aa5">Transformer KV cache — grows with every token (O(T))</text>
    <line x1="380" y1="342" x2="405" y2="342" stroke="#4f9dff" stroke-width="3"/>
    <text x="412" y="346" fill="#f5f5f7">O-series carried state — flat 0.381 MB (O(1))</text>
  </g>
  <text x="60" y="26" fill="#f5f5f7" font-size="13" font-weight="600">Inference memory vs context length — measured 512 → 1,048,576 tokens</text>
</svg>
