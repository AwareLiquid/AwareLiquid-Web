name: ops-api

# Manual ops for the inference container(s): diagnose or restart.
# Uses the same VULTR_SSH_KEY secret as deploy.yml. Read-only by default;
# restart runs ONLY when the `restart` action is explicitly selected.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diag | restart | rebuild | rollback | download | fixroute"
        required: true
        default: "diag"

permissions:
  contents: read

concurrency:
  group: ops-api
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VULTR_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 45.76.18.203 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 root@45.76.18.203 'bash -s' <<'REMOTE'
          set +e
          echo "===== docker ps ====="
          docker ps -a --format "{{.Names}}\t{{.Image}}\t{{.Status}}"
          echo "===== stats ====="
          docker stats --no-stream --format "{{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}"
          echo "===== sciqa env (safe) ====="
          for k in BASE_MODEL ADAPTER_CKPT SESSION_DB FW_SESSION_STORE QUANTIZE CPU_DTYPE; do echo "SCIQA $k=$(docker exec mtlnn_sciqa printenv $k 2>/dev/null)"; done
          echo "===== prod env (safe) ====="
          for k in CKPT_PATH TOKENIZER SESSION_DB QUANTIZE DEVICE; do echo "PROD $k=$(docker exec mtlnn_prod printenv $k 2>/dev/null)"; done
          echo "===== sciqa checkpoints/models ====="
          docker exec mtlnn_sciqa sh -c "ls -la /app/checkpoints 2>/dev/null; echo '--- models ---'; ls -la /app/models 2>/dev/null"
          echo "===== prod checkpoints ====="
          docker exec mtlnn_prod sh -c "ls -la /app/checkpoints 2>/dev/null"
          echo "===== sciqa config (no env values) ====="
          docker inspect -f 'image={{.Config.Image}}' mtlnn_sciqa
          docker inspect -f 'entrypoint={{json .Config.Entrypoint}}' mtlnn_sciqa
          docker inspect -f 'cmd={{json .Config.Cmd}}' mtlnn_sciqa
          docker inspect -f 'network={{.HostConfig.NetworkMode}}' mtlnn_sciqa
          docker inspect -f 'ports={{json .HostConfig.PortBindings}}' mtlnn_sciqa
          docker inspect -f 'restart={{.HostConfig.RestartPolicy.Name}}' mtlnn_sciqa
          docker inspect -f 'mounts={{json .Mounts}}' mtlnn_sciqa
          echo "===== /root layout ====="
          ls -la /root
          echo "--- /root/M1 ---"; ls -la /root/M1 2>/dev/null | head -40
          echo "===== compose/run scripts ====="
          find /root -maxdepth 3 \( -name "docker-compose*.yml" -o -name "compose*.yaml" -o -name "*run*.sh" \) 2>/dev/null | head -30
          echo "===== caddy routes (adapter/sci/reverse_proxy) ====="
          grep -nE "adapter|sci|mtlnn|reverse_proxy" /root/M1/deploy/Caddyfile 2>/dev/null | head -50
          echo "===== backup inspect ====="
          docker inspect mtlnn_sciqa > /root/mtlnn_sciqa.backup.json && echo "backup ok ($(wc -c < /root/mtlnn_sciqa.backup.json) bytes)"
          echo "===== server_hf.py middleware lines ====="
          grep -nE "add_middleware|BaseHTTPMiddleware|class .*Middleware" /root/M1/serve/server_hf.py 2>/dev/null
          echo "===== server_hf.py tail 300 ====="
          tail -n 300 /root/M1/serve/server_hf.py 2>/dev/null
          echo "===== sciqa recent errors ====="
          docker logs --tail 60 mtlnn_sciqa 2>&1 | tail -60
          REMOTE

      - name: Restart chat container (mtlnn_sciqa)
        if: ${{ github.event.inputs.action == 'restart' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@45.76.18.203 '
            set -e
            echo "before:"; docker ps --format "{{.Names}}\t{{.Status}}"
            docker restart mtlnn_sciqa
            sleep 10
            echo "after:"; docker ps --format "{{.Names}}\t{{.Status}}"
            docker logs --tail 40 mtlnn_sciqa 2>&1
          '

      - name: Rebuild chat container (load MT adapter + disable BaseHTTP middleware)
        if: ${{ github.event.inputs.action == 'rebuild' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@45.76.18.203 'bash -s' <<'REMOTE'
          set -e
          TS=$(date +%s)
          echo "== backups =="
          docker inspect mtlnn_sciqa > /root/mtlnn_sciqa.backup.$TS.json
          cp -f /root/M1/serve/server_hf.py /root/M1/serve/server_hf.py.bak.$TS
          echo "inspect=/root/mtlnn_sciqa.backup.$TS.json  code=/root/M1/serve/server_hf.py.bak.$TS"
          mkdir -p /root/M1/adapter
          docker cp mtlnn_sciqa:/app/checkpoints/llama_mt_adapter_003000.pt /root/M1/adapter/ 2>/dev/null || true
          ls -la /root/M1/adapter
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' mtlnn_sciqa \
            | grep -vE '^(ADAPTER_CKPT|FW_SESSION_STORE|FW_SESSION_DB|HOSTNAME)=' > /root/mtlnn_sciqa.env
          mkdir -p /root/fw_sessions
          echo "== patch server_hf.py (comment out BaseHTTPMiddleware add) =="
          sed -i '/^app\.add_middleware(_SecurityHeadersMiddleware)/ s/^/# disabled BaseHTTPMiddleware SSE bug: /' /root/M1/serve/server_hf.py
          grep -n "add_middleware" /root/M1/serve/server_hf.py
          grep -q '^# disabled BaseHTTPMiddleware' /root/M1/serve/server_hf.py || { echo "PATCH FAILED"; exit 1; }
          echo "== swap container (old kept as mtlnn_sciqa_prev) =="
          docker rm -f mtlnn_sciqa_prev 2>/dev/null || true
          docker rename mtlnn_sciqa mtlnn_sciqa_prev
          docker stop mtlnn_sciqa_prev || true
          docker run -d --name mtlnn_sciqa \
            --network deploy_default \
            --network-alias sciqa \
            -p 127.0.0.1:8002:8000 \
            --restart unless-stopped \
            -v /root/M1/serve:/app/serve:ro \
            -v /root/M1/mt_lnn:/app/mt_lnn:ro \
            -v /root/models:/app/models:ro \
            -v /root/fw_sessions:/app/data \
            -v /root/M1/adapter:/app/adapter:ro \
            --env-file /root/mtlnn_sciqa.env \
            -e BASE_MODEL=/app/models/tinyllama-1.1b-chat \
            -e ADAPTER_CKPT=/app/adapter/llama_mt_adapter_003000.pt \
            -e QUANTIZE=1 \
            -e FW_SESSION_STORE=1 \
            -e FW_SESSION_DB=/app/data/fw_sessions.sqlite \
            mtlnn:latest \
            uvicorn serve.server_hf:app --host 0.0.0.0 --port 8000
          echo "== wait for model load =="
          sleep 30
          docker ps --filter name=mtlnn_sciqa --format "{{.Names}}\t{{.Status}}"
          docker logs --tail 45 mtlnn_sciqa 2>&1 | tail -45
          echo "== probe =="
          curl -s -o /dev/null -w "model=%{http_code}\n" --max-time 15 http://127.0.0.1:8002/v1/model || true
          REMOTE

      - name: Rollback chat container
        if: ${{ github.event.inputs.action == 'rollback' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@45.76.18.203 'bash -s' <<'REMOTE'
          set -e
          echo "== rollback: drop new, restore prev =="
          docker rm -f mtlnn_sciqa || true
          docker rename mtlnn_sciqa_prev mtlnn_sciqa
          docker start mtlnn_sciqa
          sleep 3
          docker ps --filter name=mtlnn_sciqa --format "{{.Names}}\t{{.Status}}"
          REMOTE

      - name: Fix route alias (sciqa)
        if: ${{ github.event.inputs.action == 'fixroute' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@45.76.18.203 'bash -s' <<'REMOTE'
          set -e
          docker network disconnect deploy_default mtlnn_sciqa || true
          docker network connect --alias sciqa deploy_default mtlnn_sciqa
          docker inspect -f "{{json .NetworkSettings.Networks}}" mtlnn_sciqa
          REMOTE

      - name: Download base model (TinyLlama-1.1B-Chat)
        if: ${{ github.event.inputs.action == 'download' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@45.76.18.203 'bash -s' <<'REMOTE'
          set -e
          echo "== disk =="
          df -h /
          echo "== existing models =="
          ls -la /root/models
          echo "== download TinyLlama-1.1B-Chat via mtlnn:latest image =="
          docker run --rm -v /root/models:/models mtlnn:latest \
            python -c "from huggingface_hub import snapshot_download; snapshot_download('TinyLlama/TinyLlama-1.1B-Chat-v1.0', local_dir='/models/tinyllama-1.1b-chat', local_dir_use_symlinks=False)"
          echo "== result =="
          ls -la /root/models/tinyllama-1.1b-chat | head -20
          du -sh /root/models/tinyllama-1.1b-chat
          REMOTE
