name: ops-api

# Manual ops for the inference container(s): diagnose or restart.
# Uses the same VULTR_SSH_KEY secret as deploy.yml. Read-only by default;
# restart runs ONLY when the `restart` action is explicitly selected.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diag | restart"
        required: true
        default: "diag"

permissions:
  contents: read

concurrency:
  group: ops-api
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VULTR_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 45.76.18.203 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 root@45.76.18.203 'bash -s' <<'REMOTE'
          set +e
          echo "===== docker ps ====="
          docker ps -a --format "{{.Names}}\t{{.Image}}\t{{.Status}}"
          echo "===== stats ====="
          docker stats --no-stream --format "{{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}"
          echo "===== sciqa env (safe) ====="
          for k in BASE_MODEL ADAPTER_CKPT SESSION_DB FW_SESSION_STORE QUANTIZE CPU_DTYPE; do echo "SCIQA $k=$(docker exec mtlnn_sciqa printenv $k 2>/dev/null)"; done
          echo "===== prod env (safe) ====="
          for k in CKPT_PATH TOKENIZER SESSION_DB QUANTIZE DEVICE; do echo "PROD $k=$(docker exec mtlnn_prod printenv $k 2>/dev/null)"; done
          echo "===== sciqa checkpoints/models ====="
          docker exec mtlnn_sciqa sh -c "ls -la /app/checkpoints 2>/dev/null; echo '--- models ---'; ls -la /app/models 2>/dev/null"
          echo "===== prod checkpoints ====="
          docker exec mtlnn_prod sh -c "ls -la /app/checkpoints 2>/dev/null"
          echo "===== sciqa recent errors ====="
          docker logs --tail 60 mtlnn_sciqa 2>&1 | tail -60
          REMOTE

      - name: Restart chat container (mtlnn_sciqa)
        if: ${{ github.event.inputs.action == 'restart' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@45.76.18.203 '
            set -e
            echo "before:"; docker ps --format "{{.Names}}\t{{.Status}}"
            docker restart mtlnn_sciqa
            sleep 10
            echo "after:"; docker ps --format "{{.Names}}\t{{.Status}}"
            docker logs --tail 40 mtlnn_sciqa 2>&1
          '
