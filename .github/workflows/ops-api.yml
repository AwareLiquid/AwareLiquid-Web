name: ops-api

# Manual ops for the inference container(s): diagnose or restart.
# Uses the same VULTR_SSH_KEY secret as deploy.yml. Read-only by default;
# restart runs ONLY when the `restart` action is explicitly selected.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diag | restart"
        required: true
        default: "diag"

permissions:
  contents: read

concurrency:
  group: ops-api
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VULTR_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 45.76.18.203 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 root@45.76.18.203 '
            set +e
            echo "===== docker ps -a ====="
            docker ps -a --format "{{.Names}}\t{{.Image}}\t{{.Status}}"
            echo "===== docker stats ====="
            docker stats --no-stream --format "{{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}"
            echo "===== inspect ====="
            for c in $(docker ps -a --format "{{.Names}}"); do docker inspect -f "{{.Name}} restart={{.RestartCount}} image={{.Config.Image}} started={{.State.StartedAt}}" "$c"; done
            echo "===== container mem limit ====="
            docker inspect -f "mem_limit={{.HostConfig.Memory}} memswap={{.HostConfig.MemorySwap}}" mtlnn_sciqa
            docker exec mtlnn_sciqa sh -c "cat /sys/fs/cgroup/memory.events 2>/dev/null || cat /sys/fs/cgroup/memory/memory.failcnt 2>/dev/null || echo n/a" || true
            echo "===== safe env (no secrets) ====="
            docker exec mtlnn_sciqa sh -c 'for k in BASE_MODEL ADAPTER_CKPT SESSION_DB FW_SESSION_STORE QUANTIZE CPU_DTYPE AWARENESS_ENABLED CONV_MEMORY; do printf "SCIQA %s=%s\n" "$k" "$(printenv $k)"; done' || true
            docker exec mtlnn_prod sh -c 'for k in CKPT_PATH TOKENIZER SESSION_DB QUANTIZE DEVICE; do printf "PROD %s=%s\n" "$k" "$(printenv $k)"; done' || true
            echo "===== checkpoints / models ====="
            docker exec mtlnn_sciqa sh -c 'echo "[sciqa checkpoints]"; ls -la /app/checkpoints 2>/dev/null; echo "[sciqa models]"; ls -la /app/models 2>/dev/null' || true
            docker exec mtlnn_prod sh -c 'echo "[prod checkpoints]"; ls -la /app/checkpoints 2>/dev/null' || true
            echo "===== sciqa first traceback (lines 92-150) ====="
            docker logs mtlnn_sciqa 2>&1 | sed -n "92,150p"
            echo "===== memory ====="
            free -m
            echo "===== oom (dmesg) ====="
            (dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20) || echo "(unavailable)"
            echo "===== mtlnn_sciqa startup (first 80) ====="
            docker logs mtlnn_sciqa 2>&1 | head -80
            echo "===== mtlnn_sciqa error context ====="
            docker logs mtlnn_sciqa 2>&1 | grep -nE "Traceback|Error|Exception|No response|MemoryError|Killed|RuntimeError|OOM|dtype|adapter|generator|CUDA|busy" | tail -120
            echo "===== mtlnn_sciqa tail 120 ====="
            docker logs --tail 120 mtlnn_sciqa 2>&1
          '

      - name: Restart chat container (mtlnn_sciqa)
        if: ${{ github.event.inputs.action == 'restart' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@45.76.18.203 '
            set -e
            echo "before:"; docker ps --format "{{.Names}}\t{{.Status}}"
            docker restart mtlnn_sciqa
            sleep 10
            echo "after:"; docker ps --format "{{.Names}}\t{{.Status}}"
            docker logs --tail 40 mtlnn_sciqa 2>&1
          '
