name: deploy-awareliquid

# Auto-deploy awareliquid.ai: on push to main, SSH to the Vultr server,
# fast-forward the repo, and restart the app container. Replaces the manual
# `cd /root/AwareLiquid-Web && git pull && docker restart echomtlnn_prod`.
#
# Requires repo secret VULTR_SSH_KEY = the private key whose public half is in
# /root/.ssh/authorized_keys on 45.76.18.203.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-awareliquid
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VULTR_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 45.76.18.203 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (align repo to origin)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=25 \
              root@45.76.18.203 '
            set -e
            cd /root/AwareLiquid-Web
            git config core.autocrlf false
            git fetch origin main
            git reset --hard origin/main
            echo "HEAD=$(git rev-parse --short HEAD)"
            echo DEPLOY_OK
          '

      - name: Ensure Caddy serves the new root pages
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              root@45.76.18.203 "cat > /tmp/patch_caddy.py" <<'PY'
          import sys, re
          p = "/root/M1/deploy/Caddyfile"
          s = open(p).read()
          PATHS = "/vibe-coding /ai-coworker /best-ai-coding-2026 /raise"
          header = "\t@newpages path " + PATHS + "\n\thandle @newpages {\n"
          body = "\t\t@noext not path_regexp \\.(html|css|js|png|xml|ico|json|txt)$\n\t\trewrite @noext {uri}.html\n\t\troot * /web\n\t\tfile_server\n\t}\n\n"
          if "@newpages" in s:
              new = re.sub(r"@newpages path[^\n]*", "@newpages path " + PATHS, s)
              if new != s:
                  open(p, "w").write(new); print("CADDY_UPDATED")
              else:
                  print("CADDY_OK")
              sys.exit(0)
          bad_header = "\thandle /vibe-coding /ai-coworker /best-ai-coding-2026 {\n"
          if bad_header in s:
              open(p, "w").write(s.replace(bad_header, header, 1)); print("CADDY_FIXED"); sys.exit(0)
          marker = "\thandle_path /adapter/* {"
          if marker not in s:
              print("MARKER_NOT_FOUND"); sys.exit(1)
          open(p, "w").write(s.replace(marker, header + body + marker, 1)); print("CADDY_PATCHED")
          PY
          ssh -i ~/.ssh/deploy_key root@45.76.18.203 "python3 /tmp/patch_caddy.py"
          ssh -i ~/.ssh/deploy_key root@45.76.18.203 "docker exec caddy_prod caddy reload --config /etc/caddy/Caddyfile && echo CADDY_RELOADED"

      - name: Verify live pages
        run: |
          for p in / /hypercode /vibe-coding /ai-coworker /best-ai-coding-2026 /en/vibe-coding /en/ai-coworker /en/best-ai-coding-2026; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "https://awareliquid.ai$p")
            echo "$p -> $code"
          done
